<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Abinoxx Engine v3.2</title>
    <style>
        :root {
            --bg: #0f1115;
            --card: #1b1e24;
            --accent: #ff3b30; /* Chili Red */
            --text: #efefef;
            --input: #262c36;
            --tag-bg: #2d3440;
            --tag-active: #ff3b30;
            --fav-accent: #ffcc00;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0; padding: 15px;
            display: flex; flex-direction: column; align-items: center;
        }

        .container { width: 100%; max-width: 480px; background: var(--card); padding: 20px; border-radius: 28px; box-shadow: 0 15px 35px rgba(0,0,0,0.6); box-sizing: border-box; }
        h1 { font-size: 0.9rem; text-align: center; letter-spacing: 3px; color: var(--accent); margin-bottom: 20px; text-transform: uppercase; }

        textarea, input {
            width: 100%; background: var(--input); border: 1px solid #3d4450; color: #fff;
            padding: 14px; border-radius: 16px; font-size: 16px; margin-bottom: 12px;
            box-sizing: border-box; outline: none;
        }

        .tab-nav { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 15px; padding-bottom: 5px; -webkit-overflow-scrolling: touch; }
        .tab-nav::-webkit-scrollbar { display: none; }
        .tab-item { font-size: 12px; padding: 8px 14px; background: #333; border-radius: 12px; white-space: nowrap; cursor: pointer; color: #aaa; flex-shrink: 0; }
        .tab-item.active { background: var(--accent); color: #fff; }

        .tag-content { display: none; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; min-height: 120px; }
        .tag-content.active { display: flex; }
        
        .tag {
            background: var(--tag-bg); border: 1px solid #444; color: #ddd;
            padding: 8px 12px; border-radius: 12px; font-size: 11px; cursor: pointer; transition: 0.2s;
        }
        .tag.active { background: var(--tag-active); border-color: var(--tag-active); color: white; transform: scale(1.05); }
        .tag-special { border-color: var(--fav-accent); color: var(--fav-accent); }

        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button { border: none; border-radius: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .gen-btn { grid-column: span 2; background: linear-gradient(135deg, #ff3b30, #b31d14); color: white; padding: 18px; font-size: 1.2rem; margin-bottom: 5px; }
        .sub-btn { background: #3a414d; color: white; padding: 14px; font-size: 0.9rem; }
        .copy-btn { grid-column: span 2; background: transparent; border: 1px solid #444; color: #888; margin-top: 5px; padding: 10px; font-size: 0.8rem; }

        #result-area { margin-top: 25px; text-align: center; display: none; width: 100%; }
        #output-img { width: 100%; border-radius: 20px; border: 2px solid #2d3440; margin-bottom: 12px; }
        #seed-display { font-family: monospace; font-size: 11px; color: #666; }
    </style>
</head>
<body>

<div class="container">
    <h1>Abinoxx Engine v3.2</h1>

    <textarea id="mainPrompt" rows="4" placeholder="Waiting for prompt..."></textarea>
    <input type="number" id="seedInput" placeholder="SEED (Automatic if empty)">

    <div class="tab-nav">
        <div class="tab-item active" onclick="showTab('favorites')">⭐ Favorites</div>
        <div class="tab-item" onclick="showTab('art')">Art/History</div>
        <div class="tab-item" onclick="showTab('illustration')">Illustration</div>
        <div class="tab-item" onclick="showTab('material')">Material/FX</div>
        <div class="tab-item" onclick="showTab('camera')">Layout/Retro</div>
    </div>

    <div id="favorites" class="tag-content active">
        <div class="tag tag-special" onclick="appendMainPrompt('Game-style cartoon character, flat colors, bold lines, serious but meta-humorous atmosphere')">メタユーモア</div>
        <div class="tag tag-special" onclick="appendMainPrompt('Hand-drawn illustration, detailed texture, calm tones, distinctive character personality')">こだわり手描き</div>
        <div class="tag tag-special" onclick="appendMainPrompt('Realistic-leaning deformation, mature style, emphasized facial features, compact body balance')">リアル寄りデフォルメ</div>
        <div class="tag tag-special" onclick="appendMainPrompt('Simple bold lines, sharp outlines, rounded deformation, simple circular/oval shapes, humorous large eyes')">シンプル＆愛嬌</div>
        <div class="tag tag-special" onclick="appendMainPrompt('Tim Burton style, eerie but charming, long limbs, dark gothic colors, gothic atmosphere')">バートン風</div>
    </div>

    <!-- 他のセクション（省略不可のため統合したまま） -->
    <div id="art" class="tag-content">
        <div class="tag" onclick="toggleTag(this, 'Japanese woodblock print style, flat perspective, traditional palette, minimal shading, bold outlines')">日本画(4)</div>
        <div class="tag" onclick="toggleTag(this, 'classical oil painting style, chiaroscuro lighting, rich textures, realistic anatomy, canvas grain')">油絵(8)</div>
        <div class="tag" onclick="toggleTag(this, 'Egyptian wall painting style, flat symbolic figures, ancient iconography, earthy tones, stone texture')">エジプト壁画</div>
        <!-- 他のタグ... -->
    </div>

    <div id="illustration" class="tag-content">
        <div class="tag" onclick="toggleTag(this, 'anime-style, cel-shaded, vibrant color, sharp lineart')">アニメ(1)</div>
        <div class="tag" onclick="toggleTag(this, 'Western cartoon style, bold outlines, bright saturated colors, exaggerated expressions')">カートゥーン(6)</div>
        <!-- 他のタグ... -->
    </div>

    <div id="material" class="tag-content">
        <div class="tag" onclick="toggleTag(this, 'cyberpunk art style, neon glow, dark contrast, futuristic elements, vivid lighting effects')">サイバーパンク(7)</div>
        <!-- 他のタグ... -->
    </div>

    <div id="camera" class="tag-content">
        <div class="tag" onclick="toggleTag(this, 'Gekiga style, dramatic shading, intense masculine lines, retro Japanese action manga aesthetic')">劇画調</div>
        <div class="tag" onclick="toggleTag(this, 'Minimalist hand-drawn doodle, quirky illustration, intentional simple linework')">ヘタウマ</div>
    </div>

    <div class="btn-grid">
        <button class="gen-btn" onclick="generate()">GENERATE</button>
        <button class="sub-btn" onclick="retry()">RETRY</button>
        <button class="sub-btn" onclick="resetAll()">RESET</button>
        <button class="copy-btn" onclick="copyFinalPrompt()">FINAL PROMPT COPY</button>
    </div>

    <div id="result-area">
        <img id="output-img" src="" alt="Generated">
        <div id="seed-display"></div>
    </div>
</div>

<script>
    let activeTags = [];

    window.onload = () => {
        const p = new URLSearchParams(window.location.search).get('p');
        if (p) document.getElementById('mainPrompt').value = decodeURIComponent(p);
    };

    function showTab(tabId) {
        document.querySelectorAll('.tag-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    function toggleTag(el, tagValue) {
        el.classList.toggle('active');
        if (el.classList.contains('active')) {
            activeTags.push(tagValue);
        } else {
            activeTags = activeTags.filter(t => t !== tagValue);
        }
    }

    // 既存の文字を消さずに、後ろに「, 」を付けて追加する
    function appendMainPrompt(text) {
        const promptArea = document.getElementById('mainPrompt');
        const currentVal = promptArea.value.trim();
        
        if (currentVal === "") {
            promptArea.value = text;
        } else {
            // すでに何か入っていたらカンマで繋ぐ
            promptArea.value = currentVal + ", " + text;
        }
        
        const btn = event.currentTarget;
        const originalText = btn.innerText;
        btn.innerText = "ADDED!";
        setTimeout(() => btn.innerText = originalText, 1000);
    }

    function resetAll() {
        if(confirm('設定をリセットしますか？')) location.href = location.pathname;
    }

    function generate() {
        const base = document.getElementById('mainPrompt').value;
        if (!base) return alert('プロンプトを入力してください');
        let seed = document.getElementById('seedInput').value || Math.floor(Math.random() * 1000000000);
        document.getElementById('seedInput').value = seed;
        let final = base + (activeTags.length > 0 ? ", " + activeTags.join(", ") : "");
        const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(final)}?seed=${seed}&nologo=true&t=${Date.now()}`;
        const area = document.getElementById('result-area');
        const img = document.getElementById('output-img');
        area.style.display = 'block';
        img.style.opacity = '0.3';
        img.src = url;
        document.getElementById('seed-display').innerText = `SEED: ${seed}`;
        img.onload = () => img.style.opacity = '1';
        setTimeout(() => img.scrollIntoView({ behavior: 'smooth', block: 'center' }), 300);
    }

    function retry() {
        document.getElementById('seedInput').value = '';
        generate();
    }

    function copyFinalPrompt() {
        const base = document.getElementById('mainPrompt').value;
        let final = base + (activeTags.length > 0 ? ", " + activeTags.join(", ") : "");
        navigator.clipboard.writeText(final).then(() => alert('コピーしました！'));
    }
</script>
</body>
</html>
