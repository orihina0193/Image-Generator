<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ABINOXX ENGINE v4.0</title>
    <style>
        :root { --primary: #ff3b30; --bg: #1c1c1e; --card: #2c2c2e; --text: #ffffff; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; }
        .container { max-width: 600px; margin: 0 auto; }
        h2 { color: var(--primary); font-size: 1.2rem; margin-bottom: 10px; border-bottom: 1px solid var(--card); padding-bottom: 5px; }
        textarea { width: 100%; height: 100px; background: var(--card); color: var(--text); border: 1px solid #444; border-radius: 10px; padding: 10px; box-sizing: border-box; font-size: 16px; margin-bottom: 15px; }
        .tab-container { display: flex; overflow-x: auto; gap: 10px; margin-bottom: 15px; padding-bottom: 5px; }
        .tab { background: var(--card); padding: 8px 15px; border-radius: 20px; white-space: nowrap; font-size: 14px; cursor: pointer; }
        .tab.active { background: var(--primary); font-weight: bold; }
        .tag-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; min-height: 150px; margin-bottom: 20px; }
        .tag-btn { background: var(--card); border: 1px solid #444; color: var(--text); padding: 10px; border-radius: 8px; font-size: 13px; cursor: pointer; transition: 0.2s; }
        .tag-btn:active { background: #3a3a3c; transform: scale(0.95); }
        .generate-btn { width: 100%; background: var(--primary); color: white; border: none; padding: 15px; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; margin-bottom: 50px; }
    </style>
</head>
<body>

<div class="container">
    <h2>ABINOXX ENGINE</h2>
    
    <!-- 入力エリア -->
    <textarea id="mainPrompt" placeholder="ここにプロンプトを入力、またはタグを選択..."></textarea>

    <!-- カテゴリータブ（自動生成） -->
    <div id="tabList" class="tab-container"></div>

    <!-- タグボタン（自動生成） -->
    <div id="tagGrid" class="tag-grid"></div>

    <button class="generate-btn" onclick="copyAndOpen()">GENERATE & OPEN</button>
</div>

<script>
    // 1. データ受け取り用の初期変数
    const allTags = window.externalTags || { "⭐ Favorites": [] };
    let currentTab = Object.keys(allTags)[0];

    // 2. 画面の初期化
    window.onload = () => {
        if (window.initialPrompt) {
            document.getElementById('mainPrompt').value = window.initialPrompt;
        }
        renderTabs();
        renderTags(currentTab);
    };

    // 3. カテゴリータブの描画
    function renderTabs() {
        const tabList = document.getElementById('tabList');
        tabList.innerHTML = '';
        Object.keys(allTags).forEach(cat => {
            const div = document.createElement('div');
            div.className = `tab ${cat === currentTab ? 'active' : ''}`;
            div.innerText = cat;
            div.onclick = () => {
                currentTab = cat;
                renderTabs();
                renderTags(cat);
            };
            tabList.appendChild(div);
        });
    }

    // 4. タグボタンの描画
    function renderTags(category) {
        const grid = document.getElementById('tagGrid');
        grid.innerHTML = '';
        const tags = allTags[category] || [];
        
        tags.forEach(tagStr => {
            // "表示名, プロンプト" の形式を分解
            const [name, prompt] = tagStr.split(',').map(s => s.trim());
            const btn = document.createElement('button');
            btn.className = 'tag-btn';
            btn.innerText = name;
            btn.onclick = () => addTag(prompt);
            grid.appendChild(btn);
        });
    }

    // 5. プロンプト追加
    function addTag(prompt) {
        const area = document.getElementById('mainPrompt');
        if (area.value && !area.value.endsWith(', ')) {
            area.value += ', ';
        }
        area.value += prompt;
    }

    // 6. コピーして画像生成サイト（仮）へ
    function copyAndOpen() {
        const area = document.getElementById('mainPrompt');
        navigator.clipboard.writeText(area.value).then(() => {
            alert('コピーしました！画像生成サイトを開きます。');
            // ここにImageFXや生成AIのURLを入れる
            window.location.href = "https://www.google.com/search?q=ImageFX";
        });
    }
</script>

</body>
</html>
