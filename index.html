<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Abinoxx Engine v3.7 Sync</title>
    <style>
        :root {
            --bg: #0f1115;
            --card: #1b1e24;
            --accent: #ff3b30; /* Chili Red */
            --text: #efefef;
            --input: #262c36;
            --tag-bg: #2d3440;
            --tag-active: #ff3b30;
            --fav-accent: #ffcc00;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0; padding: 15px;
            display: flex; flex-direction: column; align-items: center;
        }

        .container { width: 100%; max-width: 480px; background: var(--card); padding: 20px; border-radius: 28px; box-shadow: 0 15px 35px rgba(0,0,0,0.6); box-sizing: border-box; }
        h1 { font-size: 0.9rem; text-align: center; letter-spacing: 3px; color: var(--accent); margin-bottom: 20px; text-transform: uppercase; }

        textarea, input {
            width: 100%; background: var(--input); border: 1px solid #3d4450; color: #fff;
            padding: 14px; border-radius: 16px; font-size: 16px; margin-bottom: 12px;
            box-sizing: border-box; outline: none;
        }

        /* 同期ボタン用のエリア */
        .sync-area { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .sync-btn { background: #2d3440; border: 1px solid var(--accent); color: var(--accent); padding: 5px 12px; border-radius: 10px; font-size: 11px; cursor: pointer; }

        .tab-nav { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 15px; padding-bottom: 5px; -webkit-overflow-scrolling: touch; }
        .tab-nav::-webkit-scrollbar { display: none; }
        .tab-item { font-size: 12px; padding: 8px 14px; background: #333; border-radius: 12px; white-space: nowrap; cursor: pointer; color: #aaa; flex-shrink: 0; }
        .tab-item.active { background: var(--accent); color: #fff; }

        .tag-content { display: none; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; min-height: 120px; }
        .tag-content.active { display: flex; }
        
        .tag {
            background: var(--tag-bg); border: 1px solid #444; color: #ddd;
            padding: 8px 12px; border-radius: 12px; font-size: 11px; cursor: pointer; transition: 0.2s;
        }
        .tag.active { background: var(--tag-active); border-color: var(--tag-active); color: white; transform: scale(1.05); }

        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button { border: none; border-radius: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .gen-btn { grid-column: span 2; background: linear-gradient(135deg, #ff3b30, #b31d14); color: white; padding: 18px; font-size: 1.2rem; margin-bottom: 5px; }
        .sub-btn { background: #3a414d; color: white; padding: 14px; font-size: 0.9rem; }
        .copy-btn { grid-column: span 2; background: transparent; border: 1px solid #444; color: #888; margin-top: 5px; padding: 10px; font-size: 0.8rem; }

        #result-area { margin-top: 25px; text-align: center; display: none; width: 100%; }
        #output-img { width: 100%; border-radius: 20px; border: 2px solid #2d3440; margin-bottom: 12px; min-height: 200px; background: #222; }
    </style>
</head>
<body>

<div class="container">
    <div class="sync-area">
        <h1>Abinoxx Engine v3.7 改</h1>
        <button class="sync-btn" onclick="syncFromClipboard()">SYNC TAGS</button>
    </div>

    <textarea id="mainPrompt" rows="4" placeholder="Waiting for prompt..."></textarea>
    <input type="number" id="seedInput" placeholder="SEED (Automatic if empty)">

    <!-- ナビゲーション（動的生成用） -->
    <div id="tabNav" class="tab-nav"></div>

    <!-- タグ表示エリア（動的生成用） -->
    <div id="tagContainer">
        <p style="font-size: 12px; color: #666; text-align: center;">SYNC TAGS ボタンを押してタグを読み込んでください</p>
    </div>

    <div class="btn-grid">
        <button class="gen-btn" onclick="generate()">GENERATE</button>
        <button class="sub-btn" onclick="retry()">RETRY</button>
        <button class="sub-btn" onclick="resetAll()">RESET</button>
        <button class="copy-btn" onclick="copyFinalPrompt()">FINAL PROMPT COPY</button>
    </div>

    <div id="result-area">
        <img id="output-img" src="" alt="Generated">
        <div id="seed-display" style="font-family: monospace; font-size: 11px; color: #666;"></div>
    </div>
</div>

<script>
    let activeTags = [];
    let allTagsData = {};

    window.onload = () => {
        // ショートカットからのURLパラメータ (p) を受け取り
        const p = new URLSearchParams(window.location.search).get('p');
        if (p) document.getElementById('mainPrompt').value = decodeURIComponent(p);
        
        // 以前読み込んだタグがあれば復元（任意）
        const saved = localStorage.getItem('abinoxx_tags');
        if (saved) renderTags(JSON.parse(saved));
    };

    // クリップボードからタグを同期する核となる関数
    async function syncFromClipboard() {
        try {
            const text = await navigator.clipboard.readText();
            const data = JSON.parse(text);
            allTagsData = data;
            localStorage.setItem('abinoxx_tags', JSON.stringify(data));
            renderTags(data);
            alert("同期完了！ポコポコ増えました。");
        } catch (e) {
            alert("クリップボードに正しいタグデータがありません。AddTagで保存した後に押してください。");
        }
    }

    function renderTags(data) {
        const nav = document.getElementById('tabNav');
        const container = document.getElementById('tagContainer');
        nav.innerHTML = '';
        container.innerHTML = '';

        Object.keys(data).forEach((cat, index) => {
            // タブ生成
            const tab = document.createElement('div');
            tab.className = `tab-item ${index === 0 ? 'active' : ''}`;
            tab.innerText = cat;
            tab.onclick = (e) => showTab(cat, e.target);
            nav.appendChild(tab);

            // コンテンツ生成
            const content = document.createElement('div');
            content.id = `cat-${cat}`;
            content.className = `tag-content ${index === 0 ? 'active' : ''}`;
            
            data[cat].forEach(tagStr => {
                const [name, val] = tagStr.split(',').map(s => s.trim());
                const tagEl = document.createElement('div');
                tagEl.className = 'tag';
                tagEl.innerText = name;
                tagEl.onclick = () => appendMainPrompt(val, tagEl);
                content.appendChild(tagEl);
            });
            container.appendChild(content);
        });
    }

    function showTab(catId, target) {
        document.querySelectorAll('.tag-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
        document.getElementById(`cat-${catId}`).classList.add('active');
        target.classList.add('active');
    }

    function appendMainPrompt(text, el) {
        const promptArea = document.getElementById('mainPrompt');
        const currentVal = promptArea.value.trim();
        promptArea.value = currentVal === "" ? text : currentVal + ", " + text;
        
        el.classList.add('active');
        setTimeout(() => el.classList.remove('active'), 500);
    }

    function generate() {
        const base = document.getElementById('mainPrompt').value;
        if (!base) return alert('プロンプトを入力してください');
        let seed = document.getElementById('seedInput').value || Math.floor(Math.random() * 1000000000);
        document.getElementById('seedInput').value = seed;

        const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(base)}?seed=${seed}&nologo=true`;
        const area = document.getElementById('result-area');
        const img = document.getElementById('output-img');
        
        area.style.display = 'block';
        img.src = url;
        document.getElementById('seed-display').innerText = `SEED: ${seed}`;
        img.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function resetAll() { if(confirm('リセットしますか？')) location.reload(); }
    function retry() { document.getElementById('seedInput').value = ''; generate(); }
    function copyFinalPrompt() {
        navigator.clipboard.writeText(document.getElementById('mainPrompt').value).then(() => alert('コピーしました！'));
    }
</script>
</body>
</html>
