<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Abinoxx Engine v4.2</title>
    <style>
        :root { --bg: #0f1115; --card: #1b1e24; --accent: #ff3b30; --text: #efefef; --input: #262c36; --tag-bg: #2d3440; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 480px; background: var(--card); padding: 15px; border-radius: 28px; box-sizing: border-box; }
        h1 { font-size: 0.8rem; text-align: center; color: var(--accent); letter-spacing: 2px; margin: 10px 0; }
        .sync-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .paste-btn { background: #2d3440; border: 1px solid var(--accent); color: var(--accent); padding: 6px 12px; border-radius: 10px; font-size: 10px; font-weight: bold; }
        
        textarea { width: 100%; background: var(--input); border: 1px solid #3d4450; color: #fff; padding: 12px; border-radius: 16px; font-size: 14px; margin-bottom: 10px; box-sizing: border-box; resize: none; }
        
        /* 📐 アスペクト比選択ボタンUI */
        .ratio-container { display: flex; gap: 8px; margin-bottom: 12px; }
        .ratio-btn { flex: 1; background: var(--input); border: 1px solid #3d4450; color: #aaa; padding: 8px; border-radius: 12px; font-size: 11px; font-weight: bold; cursor: pointer; text-align: center; transition: all 0.2s; }
        .ratio-btn.active { background: #441111; border-color: var(--accent); color: #fff; }

        .tab-nav { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 10px; padding-bottom: 5px; }
        .tab-item { font-size: 11px; padding: 6px 12px; background: #333; border-radius: 10px; white-space: nowrap; color: #aaa; }
        .tab-item.active { background: var(--accent); color: #fff; }
        .tag-content { display: none; flex-wrap: wrap; gap: 6px; margin-bottom: 15px; min-height: 100px; }
        .tag-content.active { display: flex; }
        .tag { background: var(--tag-bg); border: 1px solid #444; color: #ddd; padding: 6px 10px; border-radius: 10px; font-size: 10px; }
        .tag.selected { border-color: var(--accent); background: #441111; color: #fff; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        button { border: none; border-radius: 14px; font-weight: bold; cursor: pointer; padding: 12px; }
        .gen-btn { grid-column: span 2; background: linear-gradient(135deg, #ff3b30, #b31d14); color: white; font-size: 1.1rem; }
        .sub-btn { background: #3a414d; color: white; font-size: 12px; }
        #result-area { margin-top: 20px; text-align: center; }
        .generated-img { width: 100%; border-radius: 20px; border: 2px solid #2d3440; }
    </style>
</head>
<body>
<div class="container">
    <div class="sync-row">
        <h1>ABINOXX ENGINE v4.2</h1>
        <button class="paste-btn" onclick="readFromClipboard()">PASTE</button>
    </div>

    <textarea id="mainPrompt" rows="5" placeholder="プロンプトを入力..."></textarea>

    <div class="ratio-container">
        <div class="ratio-btn active" id="ratio-9-16" onclick="setRatio(576, 1024, 'ratio-9-16')">📱 縦長 (9:16)</div>
        <div class="ratio-btn" id="ratio-1-1" onclick="setRatio(1024, 1024, 'ratio-1-1')">⬛ 正方形 (1:1)</div>
        <div class="ratio-btn" id="ratio-16-9" onclick="setRatio(1024, 576, 'ratio-16-9')">📺 横長 (16:9)</div>
    </div>

    <div id="tabNav" class="tab-nav"></div>
    <div id="tagContainer"></div>
    <div class="btn-grid">
        <button class="gen-btn" onclick="generate()">GENERATE</button>
        <button class="sub-btn" onclick="retry()">RETRY</button>
        <button class="sub-btn" onclick="resetAll()">RESET</button>
    </div>
    <div id="result-area"></div>
</div>

<script src="tags.js"></script>

<script>
    let selectedValues = new Set();
    
    // 💡 デフォルトの出力サイズを「縦長 (576 x 1024)」に設定
    let currentWidth = 576;
    let currentHeight = 1024;

    window.onload = () => { 
        if (typeof TAG_DATA !== 'undefined') renderTags(TAG_DATA); 
    };

    // 📐 サイズを切り替える関数
    function setRatio(w, h, btnId) {
        currentWidth = w;
        currentHeight = h;
        // ボタンのアクティブ表示の切り替え
        document.querySelectorAll('.ratio-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(btnId).classList.add('active');
    }

    async function readFromClipboard() {
        const text = await navigator.clipboard.readText();
        if (text) document.getElementById('mainPrompt').value = text;
    }

    function renderTags(data) {
        const nav = document.getElementById('tabNav');
        const container = document.getElementById('tagContainer');
        nav.innerHTML = ''; container.innerHTML = '';
        Object.keys(data).forEach((cat, index) => {
            const tab = document.createElement('div');
            tab.className = `tab-item ${index === 0 ? 'active' : ''}`;
            tab.innerText = cat;
            tab.onclick = () => {
                document.querySelectorAll('.tag-content, .tab-item').forEach(el => el.classList.remove('active'));
                document.getElementById(`cat-${cat}`).classList.add('active');
                tab.classList.add('active');
            };
            nav.appendChild(tab);
            const content = document.createElement('div');
            content.id = `cat-${cat}`;
            content.className = `tag-content ${index === 0 ? 'active' : ''}`;
            data[cat].forEach(tagStr => {
                const parts = tagStr.split(',').map(s => s.trim());
                const label = parts[0];
                const value = parts.slice(1).join(', ');
                const tagEl = document.createElement('div');
                tagEl.className = 'tag';
                tagEl.innerText = label;
                tagEl.onclick = () => {
                    const area = document.getElementById('mainPrompt');
                    if (selectedValues.has(value)) {
                        selectedValues.delete(value);
                        tagEl.classList.remove('selected');
                        let regex = new RegExp(`,?\\s*${value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}`, 'g');
                        area.value = area.value.replace(regex, '').replace(/^,\s*/, '').trim();
                    } else {
                        selectedValues.add(value);
                        tagEl.classList.add('selected');
                        area.value = area.value.trim() === "" ? value : area.value.trim() + ", " + value;
                    }
                };
                content.appendChild(tagEl);
            });
            container.appendChild(content);
        });
    }

    function generate() {
        let base = document.getElementById('mainPrompt').value;
        if (!base) return;
        
        // 不要なカンマなどの整理
        base = base.replace(/,\s*,/g, ',').replace(/^,/, '').trim();
        
        let seed = Math.floor(Math.random() * 1000000000);
        const resultArea = document.getElementById('result-area');
        resultArea.innerHTML = `<p style="font-size:10px;color:#ff3b30;">GENERATING ON iPhone 17...</p>`;
        
        const newImg = document.createElement('img');
        newImg.className = 'generated-img';
        
        // 💡 選択された解像度（currentWidth & currentHeight）をURLパラメーターに自動挿入！
        newImg.src = `https://image.pollinations.ai/prompt/${encodeURIComponent(base)}?seed=${seed}&width=${currentWidth}&height=${currentHeight}&nologo=true`;
        newImg.onload = () => { resultArea.innerHTML = ''; resultArea.appendChild(newImg); };
    }

    function retry() { generate(); }
    
    function resetAll() {
        document.getElementById('mainPrompt').value = '';
        selectedValues.clear();
        document.querySelectorAll('.tag').forEach(t => t.classList.remove('selected'));
        document.getElementById('result-area').innerHTML = '';
        // デフォルトサイズ（9:16）に戻す
        setRatio(576, 1024, 'ratio-9-16');
    }
</script>
</body>
</html>
