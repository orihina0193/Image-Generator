    function App() {
      const [prompt, setPrompt] = useState("");
      const [aspectRatio, setAspectRatio] = useState("1:1");
      const [seed, setSeed] = useState(() => Math.floor(Math.random() * 9999999));
      const [isManualSeed, setIsManualSeed] = useState(false);
      const [activeCategory, setActiveCategory] = useState(Object.keys(TAG_DATA)[0]);
      const [selectedTagValues, setSelectedTagValues] = useState(new Set());
      const [isGenerating, setIsGenerating] = useState(false);
      const [loadingPhase, setLoadingPhase] = useState("");
      const [resultImage, setResultImage] = useState(null);
      const [resultDetails, setResultDetails] = useState(null);
      const [history, setHistory] = useState([]);
      const [activeHistoryItem, setActiveHistoryItem] = useState(null);
      const [systemAlert, setSystemAlert] = useState(null);
      const [currentTime, setCurrentTime] = useState("");

      // Live UTC clock simulation
      useEffect(() => {
        const updateTime = () => {
          const now = new Date();
          setCurrentTime(now.toISOString().replace("T", " ").substring(0, 19) + " UTC");
        };
        updateTime();
        const interval = setInterval(updateTime, 1000);
        return () => clearInterval(interval);
      }, []);

      // Simulating loading phases
      useEffect(() => {
        if (!isGenerating) return;
        const phrases = [
          "⚡ Direct Client Handshake...",
          "🧬 Bypassing proxies for fast download...",
          "🌌 Connecting to Pollinations High-speed Gateway...",
          "🎨 Rendering canvas parameters...",
          "📦 Completed! Pulling image stream..."
        ];
        let index = 0;
        setLoadingPhase(phrases[0]);
        const inter = setInterval(() => {
          index = (index + 1) % phrases.length;
          setLoadingPhase(phrases[index]);
        }, 1200);
        return () => clearInterval(inter);
      }, [isGenerating]);

      const handleTagClick = (label, promptSegment) => {
        const isSelected = selectedTagValues.has(promptSegment);
        const newSelected = new Set(selectedTagValues);
        let currentPrompt = prompt.trim();

        if (isSelected) {
          newSelected.delete(promptSegment);
          const escapeRegExp = (str) => str.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
          const pattern = new RegExp(`,?\\s*${escapeRegExp(promptSegment)}`, "g");
          currentPrompt = currentPrompt.replace(pattern, "").replace(/^,\s*/, "").replace(/,\s*,/g, ",").trim();
        } else {
          newSelected.add(promptSegment);
          if (currentPrompt === "") {
            currentPrompt = promptSegment;
          } else {
            currentPrompt = currentPrompt.endsWith(",") 
              ? `${currentPrompt} ${promptSegment}` 
              : `${currentPrompt}, ${promptSegment}`;
          }
        }

        setSelectedTagValues(newSelected);
        setPrompt(currentPrompt);
      };

      const handleRandomCombo = () => {
        const categories = Object.keys(TAG_DATA);
        let chosenSegments = [];
        const newSelected = new Set();

        categories.forEach(category => {
          const tags = TAG_DATA[category];
          const randomTag = tags[Math.floor(Math.random() * tags.length)];
          const parts = randomTag.split(",").map(s => s.trim());
          const segment = parts.slice(1).join(", ");
          chosenSegments.push(segment);
          newSelected.add(segment);
        });

        setSelectedTagValues(newSelected);
        setPrompt(chosenSegments.join(", "));
        triggerAlert("Random combo compiled!", "success");
      };

      const handleClear = () => {
        setPrompt("");
        setSelectedTagValues(new Set());
        triggerAlert("Form options cleared", "success");
      };

      const triggerAlert = (message, type) => {
        setSystemAlert({ message, type });
        setTimeout(() => setSystemAlert(null), 3000);
      };

      // client-side direct generator - bypasses CORS with image pre-loads
      const handleGenerate = async () => {
        if (!prompt.trim()) {
          triggerAlert("Please build or write a prompt first", "warning");
          return;
        }

        setIsGenerating(true);
        setResultImage(null);
        setResultDetails(null);

        const activeSeed = isManualSeed ? seed : Math.floor(Math.random() * 9999999);
        if (!isManualSeed) {
          setSeed(activeSeed);
        }

        let width = 1024;
        let height = 1024;

        if (aspectRatio === "16:9") { width = 1344; height = 768; }
        else if (aspectRatio === "9:16") { width = 768; height = 1344; }
        else if (aspectRatio === "4:3") { width = 1152; height = 864; }
        else if (aspectRatio === "3:4") { width = 864; height = 1152; }

        const directUrl = `https://image.pollinations.ai/p/${encodeURIComponent(prompt)}?width=${width}&height=${height}&seed=${activeSeed}&model=flux&nologo=true`;

        try {
          // Preload image to ensure loading animation matches download complete
          const img = new Image();
          img.src = directUrl;
          img.crossOrigin = "anonymous";
          
          img.onload = () => {
            setResultImage(directUrl);
            setResultDetails({
              engine: "FLUX.1 Schnell (Pollinations Client-Side Direct)",
              prompt: prompt,
              seed: activeSeed,
            });

            // Set History strip
            const newItem = {
              id: Math.random().toString(36).substring(2, 9),
              imageUrl: directUrl,
              prompt: prompt,
              engine: "FLUX.1 Schnell",
              aspectRatio: aspectRatio,
              seed: activeSeed,
              timestamp: new Date().toLocaleTimeString(),
            };
            setHistory(prev => [newItem, ...prev].slice(0, 10));
            setIsGenerating(false);
          };

          img.onerror = () => {
            throw new Error("Local image load state exception");
          };

        } catch (error) {
          console.error(error);
          triggerAlert("API connection error. Setting placeholder fallback...", "warning");
          const fallbackUrl = `https://picsum.photos/seed/${activeSeed}/${width}/${height}`;
          setResultImage(fallbackUrl);
          setResultDetails({
            engine: "Picsum Static Gateway (Temporary Recovery)",
            prompt: prompt,
            seed: activeSeed
          });
          setIsGenerating(false);
        }
      };

      const handleCopyPrompt = () => {
        if (!prompt) return;
        navigator.clipboard.writeText(prompt);
        triggerAlert("Prompt copied to clipboard!", "success");
      };

      const handleRestoreHistory = (item) => {
        setPrompt(item.prompt);
        setAspectRatio(item.aspectRatio);
        setSeed(item.seed);
        setIsManualSeed(true);
        setResultImage(item.imageUrl);
        setResultDetails({
          engine: item.engine,
          prompt: item.prompt,
          seed: item.seed,
        });
        setActiveHistoryItem(item.id);
        triggerAlert("Restored design presets", "success");
      };

      return (
        <div className="min-h-screen flex flex-col items-center justify-start lg:py-10 p-4 relative font-sans text-gray-200">
          
          <div className="absolute top-0 right-0 w-96 h-96 bg-red-600/5 blur-3xl rounded-full pointer-events-none" />
          <div className="absolute bottom-0 left-0 w-96 h-96 bg-red-800/5 blur-3xl rounded-full pointer-events-none" />

          {/* Top HUD bar */}
          <div className="w-full max-w-7xl flex flex-col md:flex-row items-center justify-between text-xs tracking-widest text-gray-500 font-mono mb-6 border-b border-cyber-border pb-3 px-2 gap-2 border-slate-800 pb-3">
            <div className="flex items-center gap-2">
              <span className="w-2 h-2 rounded-full bg-cyber-red animate-pulse-slow" />
              <span>SYSTEM MODE: GITHUB SERVERLESS STANDALONE v7.0</span>
            </div>
            <div className="flex items-center gap-2">
              <Icon name="clock" className="w-3.5 h-3.5 text-cyber-red" />
              <span>{currentTime || "LOADING LIVE CLOCK..."}</span>
            </div>
          </div>

          <main className="w-full max-w-7xl grid grid-cols-1 lg:grid-cols-12 gap-8 relative z-10">
            
            {/* LEFT COLUMN: Input form */}
            <div className="lg:col-span-7 flex flex-col gap-6">
              
              {/* Title Card */}
              <div className="bg-cyber-card border border-cyber-border rounded-3xl p-6 relative overflow-hidden bg-slate-900/60 border-slate-800">
                <div className="absolute top-0 right-0 py-1.5 px-4 bg-cyber-red text-white font-mono text-[9px] font-bold tracking-wider rounded-bl-xl uppercase">
                  Serverless Client
                </div>
                <h1 className="font-display font-bold text-2xl md:text-3xl tracking-tight text-white flex items-center gap-2 mb-2">
                  ABINOXX ENGINE <span className="text-cyber-red font-mono text-lg font-normal tracking-wide">v7.0 Standalone</span>
                </h1>
                <p className="text-sm text-gray-400">
                  GitHub-ready static system. This edition is optimized for client-side execution using direct Pollinations API integration.
                </p>
              </div>

              {/* Toast HUD alerts */}
              {systemAlert && (
                <div className={`p-3.5 rounded-xl border flex items-center gap-2 text-xs font-mono font-medium ${
                  systemAlert.type === "success" 
                    ? "bg-emerald-950/40 border-emerald-500/40 text-emerald-300"
                    : "bg-red-950/40 border-cyber-red/40 text-cyber-red"
                }`}>
                  <Icon name="alert" className="w-4 h-4 shrink-0" />
                  <span>{systemAlert.message}</span>
                </div>
              )}

              {/* Prompt Input Area */}
              <div className="bg-cyber-card border border-cyber-border rounded-3xl p-6 flex flex-col gap-4 bg-slate-900/60 border-slate-800">
                
                <div className="flex items-center justify-between">
                  <label className="text-sm font-semibold tracking-wide text-gray-100 flex items-center gap-2 font-display">
                    <Icon name="layers" className="w-4 h-4 text-cyber-red" />
                    CREATE PROMPT TEXT
                  </label>
                  
                  <div className="flex gap-2">
                    <button
                      onClick={handleClear}
                      className="bg-cyber-tag hover:bg-slate-800 text-gray-400 hover:text-white border border-slate-800 py-1.5 px-3 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition-all"
                    >
                      <Icon name="trash" className="w-3.5 h-3.5" />
                      <span>RESET</span>
                    </button>
                  </div>
                </div>

                <div className="relative">
                  <textarea
                    className="w-full h-36 bg-slate-950 border border-slate-800 rounded-2xl p-4 text-sm text-white focus:outline-none focus:ring-1 focus:ring-cyber-red focus:border-cyber-red transition-all duration-300 resize-none leading-relaxed"
                    placeholder="プロンプトを入力、または下記のタグパレットをクリックしてアイデアを追加..."
                    value={prompt}
                    onChange={(e) => setPrompt(e.target.value)}
                  />
                  {prompt && (
                    <button
                      onClick={handleCopyPrompt}
                      className="absolute bottom-3 right-3 p-2 bg-slate-800 hover:bg-cyber-red text-gray-300 hover:text-white rounded-lg transition-all active:scale-95 border border-slate-700"
                      title="Copy prompt"
                    >
                      <Icon name="copy" className="w-4 h-4" />
                    </button>
                  )}
                </div>

                <div className="flex flex-wrap gap-2 justify-between items-center bg-slate-950/40 p-3 rounded-xl border border-slate-800/60">
                  <div className="text-xs text-gray-500 font-mono">
                    CHARACTERS: <span className="text-gray-300">{prompt.length}</span>
                  </div>
                  <button
                    onClick={handleRandomCombo}
                    className="bg-gradient-to-r from-red-600/20 to-amber-600/20 hover:from-red-600/30 hover:to-amber-600/30 text-amber-200 border border-amber-500/20 py-1 px-3 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition-all active:scale-95"
                  >
                    <Icon name="dices" className="w-3.5 h-3.5" />
                    <span>🎲 MATCH RANDOM COMBO</span>
                  </button>
                </div>

              </div>

              {/* Tag Palettes Tabs */}
              <div className="bg-cyber-card border border-cyber-border rounded-3xl p-6 flex flex-col gap-4 bg-slate-900/60 border-slate-800">
                <div className="flex items-center gap-2 border-b border-slate-800 pb-3 overflow-x-auto whitespace-nowrap">
                  {Object.keys(TAG_DATA).map((categoryName) => (
                    <button
                      key={categoryName}
                      onClick={() => setActiveCategory(categoryName)}
                      className={`py-1.5 px-3.5 rounded-xl text-xs font-medium font-display transition-all ${
                        activeCategory === categoryName
                          ? "bg-cyber-red text-white shadow-md"
                          : "bg-slate-950 hover:bg-slate-800 text-gray-400 hover:text-gray-200"
                      }`}
                    >
                      {categoryName}
                    </button>
                  ))}
                </div>

                <div className="min-h-48">
                  <div className="flex flex-wrap gap-2.5">
                    {TAG_DATA[activeCategory].map((tagStr) => {
                      const parts = tagStr.split(",").map((s) => s.trim());
                      const label = parts[0];
                      const promptSegment = parts.slice(1).join(", ");
                      const isSelected = selectedTagValues.has(promptSegment);

                      return (
                        <button
                          key={label}
                          onClick={() => handleTagClick(label, promptSegment)}
                          className={`text-[11px] font-medium py-2 px-3.5 rounded-xl border transition-all duration-300 text-left active:scale-95 max-w-[200px] truncate ${
                            isSelected
                              ? "bg-red-950/60 border-cyber-red text-white"
                              : "bg-slate-950 hover:bg-slate-800 border-slate-800 text-gray-300"
                          }`}
                          title={promptSegment}
                        >
                          <span className="block truncate">{label}</span>
                        </button>
                      );
                    })}
                  </div>
                </div>

                <div className="text-[10px] text-gray-500 font-mono mt-2 flex items-center gap-1">
                  <Icon name="info" className="w-3.5 h-3.5 text-cyber-red shrink-0" />
                  <span>Clicking tags appends or removes stylized templates from the prompt editor.</span>
                </div>

              </div>

            </div>

            {/* RIGHT COLUMN: Settings & Art Canvas */}
            <div className="lg:col-span-5 flex flex-col gap-6">
              
              {/* Configuration Panel */}
              <div className="bg-cyber-card border border-cyber-border rounded-3xl p-6 flex flex-col gap-5 bg-slate-900/60 border-slate-800">
                
                <h2 className="text-sm font-semibold tracking-wide text-gray-100 flex items-center gap-2 font-display border-b border-slate-800 pb-3">
                  <Icon name="sliders" className="w-4 h-4 text-cyber-red" />
                  ENGINE CONFIGURATION
                </h2>

                {/* Aspect ratio */}
                <div className="flex flex-col gap-2">
                  <label className="text-[10px] text-gray-500 font-mono tracking-widest uppercase">
                    ASPECT RATIO
                  </label>
                  <div className="grid grid-cols-5 gap-2">
                    {[
                      { ratio: "1:1", label: "1:1", desc: "Square" },
                      { ratio: "16:9", label: "16:9", desc: "Widescreen" },
                      { ratio: "9:16", label: "9:16", desc: "Portrait" },
                      { ratio: "4:3", label: "4:3", desc: "Classic" },
                      { ratio: "3:4", label: "3:4", desc: "Book" }
                    ].map((item) => (
                      <button
                        key={item.ratio}
                        onClick={() => setAspectRatio(item.ratio)}
                        className={`flex flex-col items-center justify-between p-2 rounded-xl border transition-all text-center ${
                          aspectRatio === item.ratio
                            ? "bg-red-950/40 border-cyber-red text-white"
                            : "bg-slate-950 hover:bg-slate-800 border-slate-800 text-gray-400"
                        }`}
                      >
                        <span className="text-[10px] font-bold font-mono">{item.label}</span>
                        <span className="text-[8px] text-gray-500 block truncate w-full">{item.desc}</span>
                      </button>
                    ))}
                  </div>
                </div>

                {/* Seed options */}
                <div className="flex flex-col gap-2">
                  <div className="flex items-center justify-between">
                    <label className="text-[10px] text-gray-500 font-mono tracking-widest uppercase">
                      GENERATIVE SEED ID
                    </label>
                    <div className="flex items-center gap-1.5 focus:outline-none">
                      <input
                        type="checkbox"
                        id="seed-checkbox-2"
                        checked={isManualSeed}
                        onChange={(e) => setIsManualSeed(e.target.checked)}
                        className="w-3.5 h-3.5 text-cyber-red bg-slate-950 border-slate-800 accent-cyber-red rounded cursor-pointer"
                      />
                      <label htmlFor="seed-checkbox-2" className="text-[10px] text-gray-400 cursor-pointer">
                        LOCK SEED
                      </label>
                    </div>
                  </div>

                  <div className="flex gap-2">
                    <input
                      type="number"
                      disabled={!isManualSeed}
                      className={`flex-1 bg-slate-950 border text-white rounded-xl py-2 px-3.5 text-xs font-mono focus:outline-none ${
                        isManualSeed 
                          ? "border-slate-800 focus:ring-1 focus:ring-cyber-red" 
                          : "border-slate-800/40 text-gray-500 cursor-not-allowed"
                      }`}
                      value={seed}
                      onChange={(e) => setSeed(parseInt(e.target.value) || 0)}
                    />
                    <button
                      onClick={() => setSeed(Math.floor(Math.random() * 9999999))}
                      disabled={!isManualSeed}
                      className="py-2 px-3 bg-slate-950 hover:bg-slate-800 text-gray-300 border border-slate-800 rounded-xl text-xs font-semibold flex items-center gap-1 active:scale-95 disabled:opacity-30 disabled:cursor-not-allowed"
                    >
                      <Icon name="refresh" className="w-3.5 h-3.5" />
                      <span>ROLL</span>
                    </button>
                  </div>
                </div>

                {/* Actions Trigger */}
                <button
                  onClick={handleGenerate}
                  disabled={isGenerating}
                  className={`w-full font-display font-medium text-white text-base py-3.5 rounded-2xl flex items-center justify-center gap-2.5 transition-all shadow-lg active:scale-[98%] ${
                    isGenerating 
                      ? "bg-slate-800 text-gray-500 cursor-not-allowed" 
                      : "bg-gradient-to-r from-red-600 to-amber-700 hover:from-red-500 hover:to-amber-600 cursor-pointer"
                  }`}
                >
                  {isGenerating ? (
                    <Icon name="refresh" className="w-5 h-5 animate-spin" />
                  ) : (
                    <Icon name="sparkles" className="w-5 h-5" />
                  )}
                  <span className="font-semibold tracking-wider">GENERATE ILLUST</span>
                </button>

              </div>

              {/* Artwork Render Area */}
              <div className="bg-cyber-card border border-cyber-border rounded-3xl p-6 flex flex-col gap-4 min-h-[380px] justify-center bg-slate-900/60 border-slate-800">
                {isGenerating ? (
                  <div className="flex flex-col items-center justify-center gap-4 py-8">
                    <div className="relative flex items-center justify-center">
                      <div className="w-16 h-16 rounded-full border-4 border-slate-800" />
                      <div className="absolute w-16 h-16 rounded-full border-4 border-cyber-red border-t-transparent animate-spin" />
                    </div>
                    <div className="text-center">
                      <p className="text-sm font-semibold text-gray-200 tracking-wide">CONNECTING CLIENT GATEWAY</p>
                      <p className="text-xs text-gray-500 font-mono mt-1 px-3 py-1 rounded bg-slate-950 border border-slate-800">
                        {loadingPhase}
                      </p>
                    </div>
                  </div>
                ) : resultImage ? (
                  <div className="flex flex-col gap-4">
                    <div className="relative border-2 border-slate-800 rounded-2xl overflow-hidden group bg-black/60 aspect-square flex items-center justify-center">
                      <img
                        src={resultImage}
                        alt="Generative outcome"
                        className="w-full h-full object-contain max-h-[400px]"
                        referrerPolicy="no-referrer"
                      />
                      <div className="absolute inset-0 bg-gradient-to-t from-black/90 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex flex-col justify-end p-4">
                        <div className="flex gap-2 justify-end">
                          <a
                            href={resultImage}
                            download="abinoxx-compiled-illust.jpg"
                            target="_blank"
                            rel="noreferrer"
                            className="p-2 bg-cyber-red text-white rounded-lg hover:bg-red-500"
                            title="Download Artwork"
                          >
                            <Icon name="download" className="w-4 h-4" />
                          </a>
                        </div>
                      </div>
                    </div>

                    {resultDetails && (
                      <div className="bg-slate-950/60 border border-slate-800/60 rounded-xl p-3 text-xs flex flex-col gap-1.5 font-mono">
                        <div className="flex justify-between">
                          <span className="text-gray-500">ENGINE:</span>
                          <span className="text-cyber-red font-semibold">FLUX.1 Schnell</span>
                        </div>
                        <div className="flex justify-between">
                          <span className="text-gray-500">SEED :</span>
                          <span className="text-gray-300">{resultDetails.seed}</span>
                        </div>
                        <div className="flex justify-between gap-4">
                          <span className="text-gray-500 shrink-0">PROMPT:</span>
                          <span className="text-gray-400 text-right truncate w-full" title={resultDetails.prompt}>
                            {resultDetails.prompt}
                          </span>
                        </div>
                      </div>
                    )}
                  </div>
                ) : (
                  <div className="flex flex-col items-center justify-center text-center p-8 text-gray-500">
                    <div className="p-4 bg-slate-950 border border-slate-800 rounded-full mb-3 text-cyber-red">
                      <Icon name="sparkles" className="w-8 h-8" />
                    </div>
                    <h3 className="text-sm font-semibold text-gray-300 font-display">AWAITING CLIENT SELECTION</h3>
                    <p className="text-xs text-gray-500 max-w-xs mt-1">
                      Choose tags or write a custom prompt, then tap &apos;GENERATE ILLUST&apos; to process immediate rendering.
                    </p>
                  </div>
                )}
              </div>

              {/* History list strip */}
              {history.length > 0 && (
                <div className="bg-cyber-card border border-cyber-border rounded-3xl p-6 flex flex-col gap-3 bg-slate-900/60 border-slate-800">
                  <h3 className="text-xs font-semibold tracking-wider text-gray-400 flex items-center gap-1.5 font-display">
                    <Icon name="history" className="w-3.5 h-3.5 text-cyber-red" />
                    COMPILED HISTORY STRIP ({history.length})
                  </h3>
                  <div className="grid grid-cols-5 gap-2.5">
                    {history.map((item) => (
                      <button
                        key={item.id}
                        onClick={() => handleRestoreHistory(item)}
                        className={`relative aspect-square rounded-xl overflow-hidden border bg-slate-950 group transition-all duration-300 hover:scale-105 active:scale-95 ${
                          activeHistoryItem === item.id 
                            ? "border-cyber-red ring-1 ring-cyber-red" 
                            : "border-slate-800"
                        }`}
                      >
                        <img
                          src={item.imageUrl}
                          alt="History thumbnail"
                          className="w-full h-full object-cover"
                          referrerPolicy="no-referrer"
                        />
                        <div className="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center">
                          <span className="text-[8px] text-white font-bold font-mono">RELOAD</span>
                        </div>
                      </button>
                    ))}
                  </div>
                </div>
              )}

            </div>

          </main>

          <footer className="w-full max-w-7xl text-center text-[10px] text-gray-600 font-mono mt-12 pt-6 border-t border-slate-800 select-none">
            <span>© 2200-2400 ABINOXX INTERNET LABS GROUP. HYBRID SYSTEM STANDALONE REVISION.</span>
          </footer>

        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
